[project]
name = 'skabm'
dynamic = ["version"]
dependencies = [
    "eurostat>=1.1.1",
    "httpx>=0.28.1",
    "maplib>=0.20.26",
    "numpy>=2.4.6",
    "polars>=1.42.1",
    "polars-random>=0.5.0",
    "pyarrow>=20.0.0",
    "scikit-learn>=1.6.0",
]

# State history (skabm.history) is the only thing that needs a database, and
# only a rule set that declares an ex:sig__ signal ever opens one — Schelling,
# the labour market and the interbank rules run on the core install.  maplib's
# virtualization takes a SQLAlchemy Select (it calls .subquery() on it), so
# both are needed together or not at all; the imports are function-scoped so
# the package imports fine without them.
[project.optional-dependencies]
history = [
    "duckdb>=1.5.5",
    "sqlalchemy>=2.0.52",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skabm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["PLR0911", "PLR0912", "SIM", "C4"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.uv]
package = true

# The `infer` reasoning used by skabm.behaviour.bank (Datalog / recursive
# SPARQL CONSTRUCT) is a licensed maplib add-on — free for academic / personal
# use, but not shipped in the PyPI wheels. The academic build is vendored as a
# local wheel; PyPI's 0.20.26 panics ("Contact Data Treehouse") the moment
# `Model.infer` is called. Marker-scoped to this machine's platform so the
# override is a no-op elsewhere.
[tool.uv.sources]
maplib = { path = "maplib-0.20.29-cp310-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" }

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ipython>=9.15.0",
    "prek>=0.4.6",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]
